<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ochane · Admin v2</title>
<style>
:root { --bg:#f6f7fa; --panel:#fff; --ink:#0f2744; --muted:#667389; --line:#e3e8f0; --navy:#0d2b52; --navy2:#16396b; --gold:#c8962e; --ok:#12805c; --warn:#b26a00; --bad:#b3261e; --soft:#eef2f8; --r:12px; }
:root[data-theme="dark"] { --bg:#0a1320; --panel:#111e30; --ink:#e6edf7; --muted:#8fa0b8; --line:#22344d; --soft:#16263c; --navy:#07101c; --navy2:#0e1c2f; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px; padding:7px 12px; transition:background .15s,border-color .15s; }
button:hover { border-color:var(--gold); }
button:disabled { opacity:.45; cursor:not-allowed; }
button.pri { background:var(--gold); border-color:var(--gold); color:#fff; font-weight:700; }
button.ghost { border-color:transparent; background:transparent; }
button.bad { color:var(--bad); }
input, select, textarea { font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--ink); }
input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
textarea { min-height:84px; resize:vertical; }
label { display:block; font-weight:650; font-size:.84rem; margin:14px 0 4px; }
label small { font-weight:400; color:var(--muted); }
.hidden { display:none !important; }
/* connexion */
#login { min-height:100%; display:grid; place-items:center; padding:20px; background:var(--navy); }
#login .box { background:var(--panel); border-radius:16px; padding:28px; width:min(380px,100%); }
#login h1 { margin:0 0 4px; letter-spacing:.14em; font-size:1.1rem; }
#loginMsg { color:var(--bad); min-height:1.2em; margin-top:10px; font-size:.88rem; }
/* app */
#app { display:grid; grid-template-columns:240px 1fr; min-height:100%; }
#side { background:var(--navy); color:#cdd8ea; padding:16px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh; overflow:auto; }
#side .logo { color:#fff; font-weight:800; letter-spacing:.16em; padding:6px 10px 16px; display:flex; align-items:center; gap:8px; }
#side .logo i { width:10px; height:10px; border-radius:50%; background:var(--gold); display:inline-block; }
.nav { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; background:transparent; border:0; color:inherit; padding:8px 10px; border-radius:8px; }
.nav:hover { background:var(--navy2); }
.nav.on { background:var(--navy2); color:#fff; box-shadow:inset 3px 0 var(--gold); }
.nav[disabled] { opacity:.5; }
.nav .n { font-size:.72rem; opacity:.7; }
.nav .soon { font-size:.62rem; border:1px solid #4a5f80; padding:0 6px; border-radius:99px; }
#side .sp { flex:1; }
#side .who { font-size:.8rem; padding:8px 10px; opacity:.85; word-break:break-all; }
#main { min-width:0; display:flex; flex-direction:column; }
#top { display:flex; gap:10px; align-items:center; padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
#top .search { flex:1; max-width:460px; }
#top .city { white-space:nowrap; font-size:.85rem; color:var(--muted); border:1px solid var(--line); padding:6px 10px; border-radius:9px; }
#burger { display:none; }
#content { padding:22px 24px 60px; max-width:1240px; width:100%; margin:0 auto; }
h2.t { margin:0 0 4px; font-size:1.45rem; letter-spacing:-.01em; }
.sub { color:var(--muted); margin:0 0 18px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; text-align:left; }
.stat b { display:block; font-size:1.7rem; line-height:1.1; }
.stat span { color:var(--muted); font-size:.82rem; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; }
.bar { height:10px; background:var(--soft); border-radius:99px; overflow:hidden; margin:8px 0 4px; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,var(--gold),#e3b95a); border-radius:99px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
h3 { margin:0 0 10px; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.todo { display:flex; justify-content:space-between; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:10px 2px; background:transparent; }
.todo:last-child { border-bottom:0; }
.todo b { color:var(--gold); }
.recent { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.recent small { color:var(--muted); }
/* tableau */
.tools { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
.tools select { width:auto; }
.tools .cnt { color:var(--muted); font-size:.85rem; margin-left:auto; }
table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
th { text-align:left; font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:10px 10px; background:var(--soft); }
td { padding:8px 10px; border-top:1px solid var(--line); vertical-align:middle; }
tr.row:hover td { background:var(--soft); }
.thumb { width:46px; height:46px; border-radius:8px; background:var(--soft); object-fit:cover; display:block; }
.thumb.ph { display:grid; place-items:center; color:var(--muted); font-size:.7rem; }
.nm { font-weight:650; cursor:pointer; }
.chip { display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); white-space:nowrap; }
.chip.ok { color:var(--ok); border-color:var(--ok); } .chip.warn { color:var(--warn); border-color:var(--warn); } .chip.bad { color:var(--bad); border-color:var(--bad); } .chip.mut { color:var(--muted); }
.acts { display:flex; gap:4px; flex-wrap:wrap; }
.acts button { padding:4px 8px; font-size:.8rem; }
.pager { display:flex; gap:8px; justify-content:center; align-items:center; margin-top:14px; }
/* éditeur */
#edbar { position:sticky; top:53px; z-index:15; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
#edbar .ttl { flex:1; min-width:200px; }
#edbar h2 { margin:0; font-size:1.15rem; }
#edbar small { color:var(--muted); }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px; overflow:auto; }
.tab { border:0; border-radius:8px 8px 0 0; background:transparent; padding:9px 14px; white-space:nowrap; }
.tab.on { border-bottom:3px solid var(--gold); font-weight:700; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.miss { color:var(--warn); font-size:.82rem; }
.dirtydot { color:var(--warn); font-weight:700; }
#photoPrev { max-width:420px; width:100%; border-radius:10px; display:block; margin:8px 0; }
.pv { margin:0 auto; background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:16px; transition:width .2s; }
.pv h4 { margin:0; font-size:1.5rem; }
.pv figure { margin:12px 0 0; } .pv img { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:12px; display:block; }
.pv .fx { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-top:10px; }
.pv .fx h5 { margin:0 0 4px; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.pv .fx ul { margin:4px 0; padding-left:18px; }
#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:10px; z-index:99; max-width:90vw; }
#toast.err { background:var(--bad); }
@media (max-width:900px) {
  #app { grid-template-columns:1fr; }
  #side { position:fixed; inset:0 auto 0 0; width:260px; z-index:60; transform:translateX(-100%); transition:transform .2s; height:100%; }
  #side.open { transform:none; }
  #burger { display:inline-block; }
  .grid2, .g2 { grid-template-columns:1fr; }
  #content { padding:16px 14px 60px; }
  #top .city, #bAdd, #bIncomp { display:none; }
  /* tableau -> cartes */
  table, tbody, tr, td { display:block; }
  thead { display:none; }
  table { border:0; background:transparent; }
  tr.row { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px; padding:10px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; }
  tr.row td { border:0; padding:0; }
  tr.row td:nth-child(2) { flex:1 1 calc(100% - 64px); }
  tr.row td:nth-child(3), tr.row td:nth-child(4) { color:var(--muted); font-size:.85rem; }
  tr.row td:last-child { flex:1 1 100%; }
}
</style>
</head>
<body>
<script src="../../data/ochane-config.js"></script>

<div id="login">
  <div class="box">
    <h1>OCHANE · ADMIN</h1>
    <div style="color:var(--muted)">Connexion administrateur</div>
    <label for="em">Email</label><input id="em" type="text" autocomplete="username" inputmode="email">
    <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
    <button id="bLogin" class="pri" style="width:100%;margin-top:16px">Se connecter</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="logo"><i></i>OCHANE</div>
    <button class="nav on" data-v="dash">Tableau de bord</button>
    <button class="nav" data-v="list" data-cat="all">Tous les lieux <span class="n" id="n-all"></span></button>
    <button class="nav" data-v="list" data-cat="r">Restaurants <span class="n" id="n-r"></span></button>
    <button class="nav" data-v="list" data-cat="m">Monuments <span class="n" id="n-m"></span></button>
    <button class="nav" data-v="list" data-cat="h">Hôtels <span class="n" id="n-h"></span></button>
    <button class="nav" data-v="list" data-cat="sa">Sorties <span class="n" id="n-sa"></span></button>
    <button class="nav" data-v="list" data-cat="b">Boutiques <span class="n" id="n-b"></span></button>
    <button class="nav" disabled>Agenda <span class="soon">bientôt</span></button>
    <button class="nav" disabled>Parcours <span class="soon">bientôt</span></button>
    <button class="nav" disabled>Médiathèque <span class="soon">bientôt</span></button>
    <button class="nav" data-v="verif">Vérifications <span class="n" id="n-verif"></span></button>
    <button class="nav" disabled>Paramètres <span class="soon">bientôt</span></button>
    <div class="sp"></div>
    <div class="who" id="who"></div>
    <button class="nav" id="bOut">Déconnexion</button>
  </aside>
  <div id="main">
    <div id="top">
      <button id="burger" aria-label="Menu">☰</button>
      <input id="gq" class="search" type="search" placeholder="Rechercher un lieu, une adresse, un quartier…" autocomplete="off">
      <span class="city">Paris ▾</span>
      <button id="bIncomp">Fiches incomplètes</button>
      <button id="bAdd" disabled title="Bientôt : les lieux sont encore dans index.html">+ Ajouter un lieu</button>
      <button id="bTheme" aria-label="Thème">◐</button>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var CFG = window.OCHANE_CONFIG || {}, SB = { access: "", refresh: "", email: "" };
  var CATS = { r: "Restaurant", s: "Soirée", m: "Monument ou musée", h: "Hôtel", a: "Activité", b: "Boutique" };
  var PER = 50, STALE_DAYS = 180;
  var PLACES = [], DET = {}, META = {}, histOK = true, saving = false, dirty = false;
  var S = { view: "dash", cat: "all", f: "all", q: "", sort: "name", page: 0, cur: null, tab: "info", pvw: "desk" };
  var photoBlob = null, histRows = null;

  function norm(s) { return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
  function ordn(n) { return n === 1 ? "1er" : n + "e"; }
  function key(p) { return p.arr + "|" + p.name; }
  function arr(v) { return Array.isArray(v) ? v : (v ? [v] : []); }
  function toast(t, err) { var e = $("toast"); e.textContent = t; e.className = err ? "err" : ""; clearTimeout(toast.t); toast.t = setTimeout(function () { e.className = "hidden"; }, err ? 6000 : 2600); }

  /* ---------- Supabase ---------- */
  async function sb(path, opt, retry) {
    opt = opt || {}; opt.cache = "no-store";
    opt.headers = Object.assign({ apikey: CFG.supabaseKey, Authorization: "Bearer " + (SB.access || CFG.supabaseKey) }, opt.headers || {});
    var r = await fetch(CFG.supabaseUrl + path, opt);
    if (r.status === 401 && !retry && SB.refresh) { await token({ grant_type: "refresh_token", refresh_token: SB.refresh }); return sb(path, opt, true); }
    if (!r.ok) { var t = ""; try { var j = await r.json(); t = j.message || j.msg || j.error || ""; } catch (e) { } var er = new Error((t || "Erreur") + " (" + r.status + ")"); er.status = r.status; throw er; }
    return r;
  }
  async function token(body) {
    var r = await fetch(CFG.supabaseUrl + "/auth/v1/token?grant_type=" + body.grant_type, { method: "POST", headers: { apikey: CFG.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    var j = await r.json();
    if (!r.ok) throw new Error(r.status === 400 ? "Email ou mot de passe incorrect." : (j.msg || "Connexion impossible"));
    SB.access = j.access_token; SB.refresh = j.refresh_token; if (j.user && j.user.email) SB.email = j.user.email;
    try { localStorage.setItem("ochane-admin-sb", JSON.stringify({ refresh: SB.refresh })); } catch (e) { }
    return j;
  }

  /* ---------- données ---------- */
  function extractArr(html) {
    var i = html.indexOf("var ARR = ["); if (i < 0) throw new Error("Liste des lieux introuvable");
    var s = html.indexOf("[", i), depth = 0, inStr = false, q = "", j;
    for (j = s; j < html.length; j++) {
      var c = html[j];
      if (inStr) { if (c === "\\") j++; else if (c === q) inStr = false; continue; }
      if (c === '"' || c === "'") { inStr = true; q = c; } else if (c === "[") depth++; else if (c === "]") { depth--; if (depth === 0) break; }
    }
    return (new Function("return " + html.slice(s, j + 1)))();
  }
  async function loadAll() {
    var html = await (await fetch("../../index.html", { cache: "no-store" })).text();
    var a = extractArr(html); PLACES = [];
    a.forEach(function (g) { g.items.forEach(function (it) { PLACES.push({ arr: g.n, kind: it[0], name: it[1], q: g.q, metro: it[4] || "", desc: it[3] || "" }); }); });
    var w = {}; try { (new Function("window", await (await fetch("../../data/place-details.js", { cache: "no-store" })).text()))(w); } catch (e) { }
    DET = w.OCHANE_DETAILS || {}; META = {};
    var rows = await (await sb("/rest/v1/place_details?select=key,data,updated_at")).json();
    rows.forEach(function (r) { META[r.key] = { updated_at: r.updated_at }; if (r.data && r.data._deleted) delete DET[r.key]; else if (r.data) DET[r.key] = r.data; });
    PLACES.forEach(function (p) { p.k = key(p); p.hay = norm(p.name + " " + p.q + " " + ordn(p.arr) + " arrondissement " + p.metro + " " + ((DET[p.k] || {}).address || "")); });
  }
  function rsrc(src) { return /^https?:/.test(src || "") ? src : (src ? "../../" + src : ""); }

  /* ---------- statuts & complétude ---------- */
  var REQ = {
    m: ["summary", "address", "hours", "price", "site", "photo"], r: ["summary", "address", "photo"], h: ["summary", "address", "photo", "site"],
    s: ["summary", "address", "photo"], a: ["summary", "address", "photo"], b: ["summary", "address", "photo"]
  };
  var REC = { m: ["metro", "access", "tip", "verified"], r: ["hours", "site", "metro", "tip"], h: ["metro", "access", "tip"], s: ["hours", "site", "metro", "tip"], a: ["hours", "site", "metro", "tip"], b: ["hours", "site", "metro", "tip"] };
  var LBL = { summary: "Description courte", address: "Adresse", hours: "Horaires", price: "Tarifs", site: "Site officiel", photo: "Photo", metro: "Accès métro", access: "Accessibilité", tip: "Conseil pratique", verified: "Date de vérification" };
  function has(d, f) {
    if (f === "photo") return !!(d.photo && d.photo.src && d.photo.credit && d.photo.license);
    if (f === "hours") return !!(d.hours && (arr(d.hours.lines).length || d.hours.note));
    if (f === "price") return !!(d.price && (arr(d.price.lines).length || arr(d.price.free).length));
    if (f === "access") return !!(d.access && (d.access.level || d.access.note));
    if (f === "metro") return arr(d.metro).length > 0;
    return !!d[f];
  }
  function info(p) {
    var d = DET[p.k], o = { d: d, fiche: !!d };
    if (!d) { o.status = "none"; o.pct = 0; o.missing = (REQ[p.kind] || []).map(function (f) { return LBL[f]; }); o.complete = false; o.photo = false; o.ver = "none"; return o; }
    var req = REQ[p.kind] || REQ.r, rec = REQ[p.kind] ? REC[p.kind] : REC.r, got = 0, tot = 0, miss = [], reqMiss = 0;
    req.forEach(function (f) { tot += 2; if (has(d, f)) got += 2; else { miss.push(LBL[f]); reqMiss++; } });
    rec.forEach(function (f) { tot += 1; if (has(d, f)) got += 1; else miss.push(LBL[f] + " (recommandé)"); });
    o.pct = Math.round(100 * got / tot); o.missing = miss; o.complete = reqMiss === 0; o.photo = has(d, "photo");
    o.status = d.archived ? "archived" : (d.status === "draft" ? "draft" : "published");
    o.ver = d.verification || (d.verified ? "verified" : "unverified");
    o.stale = !!(d.verified && (Date.now() - new Date(d.verified).getTime()) / 864e5 > STALE_DAYS);
    return o;
  }
  var STAT = { none: ["Aucune fiche", "mut"], draft: ["Brouillon", "warn"], published: ["Publiée", "ok"], archived: ["Archivée", "mut"] };
  var VER = { none: ["—", "mut"], unverified: ["Non vérifiée", "mut"], toverify: ["À vérifier", "warn"], verified: ["Vérifiée", "ok"] };
  function chip(t, c) { return '<span class="chip ' + c + '">' + t + '</span>'; }
  function fmtDate(d) { try { return new Date(d).toLocaleDateString("fr-FR"); } catch (e) { return ""; } }
  function ago(iso) { if (!iso) return ""; var m = Math.round((Date.now() - new Date(iso).getTime()) / 6e4); return m < 60 ? "il y a " + Math.max(m, 1) + " min" : m < 1440 ? "il y a " + Math.round(m / 60) + " h" : fmtDate(iso); }

  /* ---------- navigation ---------- */
  function go(view, o) {
    if (dirty && S.view === "edit" && view !== "edit" && !confirm("Modifications non enregistrées. Quitter quand même ?")) return;
    dirty = false; Object.assign(S, { view: view }, o || {});
    document.querySelectorAll(".nav[data-v]").forEach(function (b) { b.classList.toggle("on", b.dataset.v === (S.view === "edit" ? "list" : S.view) && (b.dataset.cat === undefined || b.dataset.cat === S.cat || (S.view === "edit"))); });
    $("side").classList.remove("open"); render(); window.scrollTo(0, 0);
  }
  function render() { var c = $("content"); if (S.view === "dash") dash(c); else if (S.view === "list") list(c); else if (S.view === "verif") verif(c); else if (S.view === "edit") editor(c); counts(); }
  function counts() {
    var n = { all: 0, r: 0, m: 0, h: 0, sa: 0, b: 0 }, v = 0;
    PLACES.forEach(function (p) { n.all++; if (p.kind === "s" || p.kind === "a") n.sa++; else n[p.kind]++; var i = info(p); if (i.fiche && (i.ver === "toverify" || i.stale)) v++; });
    Object.keys(n).forEach(function (k) { $("n-" + k).textContent = n[k]; }); $("n-verif").textContent = v || "";
  }

  /* ---------- tableau de bord ---------- */
  function dash(c) {
    var t = PLACES.length, full = 0, inc = 0, nophoto = 0, tov = 0, pub = 0, nofiche = 0, stale = 0, drafts = 0, noPhotoFiche = 0, missEss = 0;
    PLACES.forEach(function (p) {
      var i = info(p); if (!i.fiche) { nofiche++; nophoto++; return; }
      if (i.complete) full++; else { inc++; missEss++; }
      if (!i.photo) { nophoto++; noPhotoFiche++; } if (i.ver === "toverify" || i.ver === "unverified") tov++; if (i.stale) stale++;
      if (i.status === "published") pub++; if (i.status === "draft") drafts++;
    });
    var fiches = t - nofiche, pct = t ? Math.round(100 * full / t) : 0;
    var recent = Object.keys(META).filter(function (k) { return DET[k]; }).sort(function (a, b) { return (META[b].updated_at || "") > (META[a].updated_at || "") ? 1 : -1; }).slice(0, 6);
    var byKey = {}; PLACES.forEach(function (p) { byKey[p.k] = p; });
    function todo(label, n, f) { return '<button class="todo" data-go="' + f + '"><span>' + label + '</span><b>' + n + '</b></button>'; }

  }
  function markDirty() { dirty = true; var d = $("dd"); if (d) d.classList.remove("hidden"); }
  function missing() { var m = info(S.cur).missing; var el = $("missing"); if (el) el.textContent = m.length ? "Manquant : " + m.join(", ") : "Aucune information manquante."; }

  function buildEntry(forPreview) {
    var p = S.cur, old = DET[p.k] || {}, F = FORM[p.k] || {}, e = Object.assign({}, old);
    function g(f, def) { return f in F ? F[f] : def; }
    function lines(s) { return String(s).split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
    function setS(name, v) { v = String(v == null ? "" : v).trim(); if (v) e[name] = v; else delete e[name]; }
    setS("summary", g("summary", old.summary)); setS("address", g("address", old.address)); setS("verified", g("verified", old.verified));
    if ("status" in F) { if (F.status === "draft") e.status = "draft"; else delete e.status; }
    if ("verification" in F && F.verification !== (old.verification || (old.verified ? "verified" : "unverified"))) e.verification = F.verification;
    var so = lines(g("sources", L(old.sources))), td = lines(g("todo", L(old.todo))); if (so.length) e.sources = so; else delete e.sources; if (td.length) e.todo = td; else delete e.todo;
    var h = lines(g("hours", L((old.hours || {}).lines))), hn = String(g("hoursNote", (old.hours || {}).note || "")).trim();
    if (h.length || hn) { e.hours = {}; if (h.length) e.hours.lines = h; if (hn) e.hours.note = hn; } else delete e.hours;
    var pl = lines(g("price", L((old.price || {}).lines))), pf = lines(g("free", L((old.price || {}).free))), pn = String(g("priceNote", (old.price || {}).note || "")).trim();
    if (pl.length || pf.length || pn) { e.price = {}; if (pl.length) e.price.lines = pl; if (pf.length) e.price.free = pf; if (pn) e.price.note = pn; } else delete e.price;
    var m = lines(g("metro", L(old.metro))); if (m.length === 1) e.metro = m[0]; else if (m.length > 1) e.metro = m; else delete e.metro;
    var lv = g("level", (old.access || {}).level || ""), an = String(g("accNote", (old.access || {}).note || "")).trim();
    if (lv || an) { e.access = {}; if (lv) e.access.level = lv; if (an) e.access.note = an; } else delete e.access;
    setS("tip", g("tip", old.tip)); setS("site", g("site", old.site)); setS("tickets", g("tickets", old.tickets)); setS("ticketsLabel", g("ticketsLabel", old.ticketsLabel)); setS("booking", g("booking", old.booking)); setS("menu", g("menu", old.menu));
    var op = old.photo || {};
    if (F._rmphoto && !photoBlob) delete e.photo;
    else if (photoBlob || op.src) {
      var ph = { src: op.src || "", alt: String(g("alt", op.alt || "")).trim(), credit: String(g("credit", op.credit || "")).trim(), license: String(g("license", op.license || "")).trim() };
      var lu = String(g("licenseUrl", op.licenseUrl || "")).trim(), so2 = String(g("source", op.source || "")).trim();
      if (lu) ph.licenseUrl = lu; if (so2) ph.source = so2; if (op.modified) ph.modified = op.modified; else if (photoBlob) ph.modified = "image redimensionnée et recadrée";
      e.photo = ph;
    }
    return e;
  }
  function badUrl(u) { return u && !/^https:\/\/[^\s]+$/i.test(u); }
  async function save() {
    collect(); var p = S.cur, e = buildEntry(), errs = [];
    ["site", "tickets", "booking", "menu"].forEach(function (f) { if (badUrl(e[f])) errs.push("Lien invalide (https requis) : " + f); });
    if (e.photo && (badUrl(e.photo.licenseUrl) || badUrl(e.photo.source))) errs.push("Photo : liens de licence/source invalides (https requis).");
    if (e.photo && (!e.photo.credit || !e.photo.license)) errs.push("Photo : l'auteur et la licence sont obligatoires.");
    if (e.photo && !e.photo.alt) errs.push("Photo : texte alternatif obligatoire.");
    if (e.tickets && !e.site) errs.push("Billets : renseigne aussi le site officiel.");
    if (!Object.keys(e).length) errs.push("Fiche vide.");
    if (errs.length) { toast(errs.join(" "), true); return; }
    var btn = $("eSave"); btn.disabled = true; btn.textContent = "Enregistrement…";
    try {
      if (photoBlob) {
        var nm = slug(p.name) + "-" + Date.now().toString(36) + ".jpg";
        await sb("/storage/v1/object/place-photos/" + nm, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: photoBlob });
        e.photo.src = CFG.supabaseUrl + "/storage/v1/object/public/place-photos/" + nm;
      }
      await upsert(p.k, e);
      DET[p.k] = e; photoBlob = null; delete FORM[p.k]; dirty = false;
      p.hay = norm(p.name + " " + p.q + " " + ordn(p.arr) + " arrondissement " + p.metro + " " + (e.address || ""));
      toast("Enregistré. Visible sur ochane.com."); editor($("content")); counts();
    } catch (x) { toast("Échec de l'enregistrement : " + x.message + " Tes modifications sont conservées dans le formulaire.", true); btn.disabled = false; btn.textContent = "Enregistrer"; }
  }
  async function showPhoto(removed) {
    var box = $("photoBox"); if (!box) return; var d = DET[S.cur.k] || {}, url = null;
    if (photoBlob) url = URL.createObjectURL(photoBlob); else if (!removed && d.photo && d.photo.src && !(FORM[S.cur.k] || {})._rmphoto) url = rsrc(d.photo.src);
    box.innerHTML = url ? '<img id="photoPrev" alt="" src="' + esc(url) + '">' : '<span style="color:var(--muted)">Aucune photo.</span>';
  }
  function onFile() {
    var f = $("f_file").files[0]; if (!f) return; var img = new Image();
    img.onload = function () {
      var W = Math.min(1600, img.naturalWidth), H = Math.round(img.naturalHeight * W / img.naturalWidth), c = document.createElement("canvas"); c.width = W; c.height = H;
      var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); x.drawImage(img, 0, 0, W, H);
      c.toBlob(function (b) { photoBlob = b; var F = FORM[S.cur.k] = FORM[S.cur.k] || {}; delete F._rmphoto; markDirty(); showPhoto(); toast("Photo prête : " + W + " × " + H + " px, " + Math.round(b.size / 1024) + " Ko. Renseigne auteur et licence."); }, "image/jpeg", 0.82);
    };
    img.onerror = function () { toast("Image illisible.", true); }; img.src = URL.createObjectURL(f);
  }

  /* ---------- aperçu & historique ---------- */
  function ul(a) { a = arr(a); return a.length ? "<ul>" + a.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : ""; }
  function previewHtml(d, p) {
    var o = '<div style="font-size:.78rem;font-weight:700;color:var(--gold);text-transform:uppercase">' + CATS[p.kind] + ' · ' + ordn(p.arr) + ' arrondissement</div><h4>' + esc(p.name) + '</h4>';
    if (d.status === "draft") o += '<p class="chip warn">Brouillon : non affichée au public</p>';
    if (d.photo && d.photo.src && d.photo.credit && d.photo.license) o += '<figure><img alt="' + esc(d.photo.alt) + '" src="' + esc(photoBlob ? URL.createObjectURL(photoBlob) : rsrc(d.photo.src)) + '"><figcaption style="font-size:.74rem;color:var(--muted)">Photo : ' + esc(d.photo.credit) + ' — ' + esc(d.photo.license) + '</figcaption></figure>';
    if (d.summary) o += '<p>' + esc(d.summary) + '</p>';
    function fx(t, b) { return b ? '<div class="fx"><h5>' + t + '</h5>' + b + '</div>' : ""; }
    o += fx("Adresse", d.address ? "<div>" + esc(d.address) + "</div>" : "") + fx("Métro", Array.isArray(d.metro) ? "<div>" + esc(d.metro[0]) + "</div>" + ul(d.metro.slice(1)) : (d.metro ? "<div>" + esc(d.metro) + "</div>" : ""));
    o += fx("Horaires officiels", d.hours ? ul(d.hours.lines) + (d.hours.note ? "<small>" + esc(d.hours.note) + "</small>" : "") : "") + fx("Tarif indicatif", d.price ? ul(d.price.lines) + (arr(d.price.free).length ? "<b style='color:var(--ok)'>Gratuité</b>" + ul(d.price.free) : "") + (d.price.note ? "<small>" + esc(d.price.note) + "</small>" : "") : "");
    o += fx("Accessibilité", d.access ? (d.access.level ? "<b>" + esc(d.access.level) + "</b> " : "") + esc(d.access.note || "") : "") + fx("Conseil OCHANE", d.tip ? "<div>" + esc(d.tip) + "</div>" : "");
    var b = []; if (d.tickets) b.push("<button class='pri'>" + esc(d.ticketsLabel || "Billets") + "</button>"); if (d.site) b.push("<button>Site officiel</button>");
    return o + (b.length ? '<div style="display:flex;gap:8px;margin-top:12px">' + b.join("") + "</div>" : "") + (d.verified ? '<p style="font-size:.78rem;color:var(--muted)">Informations vérifiées le ' + fmtDate(d.verified) + ' sur les sites officiels.</p>' : "");
  }
  async function loadHist() {
    var box = $("histBox"), p = S.cur;
    try {
      var rows = await (await sb("/rest/v1/place_history?key=eq." + encodeURIComponent(p.k) + "&select=id,data,saved_at&order=saved_at.desc&limit=20")).json(); histRows = rows;
      box.innerHTML = rows.length ? '<h3>Versions précédentes</h3>' + rows.map(function (r, n) { return '<div class="recent" style="cursor:default"><span>' + new Date(r.saved_at).toLocaleString("fr-FR") + '</span><button data-r="' + n + '">Restaurer dans le formulaire</button></div>'; }).join("") + '<p class="miss" style="color:var(--muted)">La restauration remplit le formulaire ; rien n\'est écrit tant que tu n\'as pas enregistré.</p>' : "Aucune version précédente pour l'instant : l'historique se remplit à chaque enregistrement.";
      box.querySelectorAll("[data-r]").forEach(function (b) { b.onclick = function () { var r = histRows[+b.dataset.r].data; DET[p.k] = r; delete FORM[p.k]; markDirty(); S.tab = "info"; editor($("content")); }; });
    } catch (e) { histOK = false; box.innerHTML = 'Historique non activé. Exécute <code>admin/supabase-history.sql</code> dans Supabase (SQL Editor) pour l\'activer.'; }
  }

  /* ---------- démarrage ---------- */
  async function start() {
    try { $("login").classList.add("hidden"); await loadAll(); $("app").classList.remove("hidden"); $("who").textContent = SB.email || "Administrateur"; go("dash"); }
    catch (e) { $("login").classList.remove("hidden"); $("loginMsg").textContent = "Chargement impossible : " + e.message; }
  }
  $("bLogin").onclick = async function () {
    var em = $("em").value.trim(), pw = $("pw").value; if (!em || !pw) { $("loginMsg").textContent = "Renseigne l'email et le mot de passe."; return; }
    $("loginMsg").textContent = "Connexion…";
    try { await token({ grant_type: "password", email: em, password: pw }); SB.email = SB.email || em; await start(); } catch (e) { $("loginMsg").textContent = e.message; }
  };
  $("pw").addEventListener("keydown", function (ev) { if (ev.key === "Enter") $("bLogin").click(); });
  $("bOut").onclick = function () { try { localStorage.removeItem("ochane-admin-sb"); } catch (e) { } location.reload(); };
  $("burger").onclick = function () { $("side").classList.toggle("open"); };
  document.querySelectorAll(".nav[data-v]").forEach(function (b) { b.onclick = function () { go(b.dataset.v, b.dataset.v === "list" ? { cat: b.dataset.cat, f: "all", q: "", page: 0 } : {}); }; });
  $("bIncomp").onclick = function () { go("list", { cat: "all", f: "incomplete", q: "", page: 0 }); };
  var gt; $("gq").addEventListener("input", function () { var v = this.value; clearTimeout(gt); gt = setTimeout(function () { if (S.view !== "list") go("list", { cat: "all", f: "all", q: v, page: 0 }); else { S.q = v; S.page = 0; list($("content")); } }, 200); });
  function theme(m) { document.documentElement.setAttribute("data-theme", m); try { localStorage.setItem("ochane-admin-theme", m); } catch (e) { } }
  var th = null; try { th = localStorage.getItem("ochane-admin-theme"); } catch (e) { } theme(th || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("bTheme").onclick = function () { theme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); };
  window.addEventListener("beforeunload", function (ev) { if (dirty) { ev.preventDefault(); ev.returnValue = ""; } });
  if (!CFG.supabaseUrl || !CFG.supabaseKey) { $("loginMsg").textContent = "Supabase n'est pas configuré (data/ochane-config.js)."; $("bLogin").disabled = true; }
  else { try { var ss = JSON.parse(localStorage.getItem("ochane-admin-sb") || "null"); if (ss && ss.refresh) { SB.refresh = ss.refresh; token({ grant_type: "refresh_token", refresh_token: ss.refresh }).then(start).catch(function () { $("loginMsg").textContent = "Session expirée : reconnecte-toi."; }); } } catch (e) { } }
})();
</script>
</body>
</html>
